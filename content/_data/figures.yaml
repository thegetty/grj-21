    src: "figures/the-getty-peacock-fresco-fig-9-ab.jpg"
    label: "Figs 9A, 9B. —"
    caption: "**Scanning electron microscopy (SEM) backscattered electron image of ultramarine pigments from the Getty Peacock:** a) a sample from the peacock’s breast showing uniformly small, round-edged particles characteristic of synthetically produced ultramarine pigment; and b) reference SEM image showing natural ultramarine pigment extracted from Afghan lapis lazuli, from M. Favaro et al., “Characterization of Lapis Lazuli and Corresponding Purified Pigments for a Provenance Study of Ultramarine Pigments Used in Works of Art,” *Analytical and Bioanalytical Chemistry* 402, no. 6 (2012): p. TK."
