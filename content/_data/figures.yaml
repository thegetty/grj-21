  - id: "the-getty-peacock-fresco-fig-6"
    src: "figures/the-getty-peacock-fresco-fig-6.jpg"
    label: "Figs. 6A–D. —"
    caption: "**Macro X-ray fluorescence (MA-XRF) element-distribution maps of the Getty Peacock indicating the presence of iron (Fe) (a), zinc (Zn) (b), copper (Cu) &#40;c), and chromium (Cr) (d).**"
    credit: ""
    alt: "TK"
    zoom: "true"
  - id: "the-getty-peacock-fresco-fig-7"
    src: "figures/the-getty-peacock-fresco-fig-7.jpg"
    label: "Figs. 7A, 7B. —"
    caption: "**Images of a cross-sectioned sample from the balustrade of the Getty Peacock under visible light and backscattered electron (BSE) imaging overlaid with  energy dispersive X-ray spectroscopy (SEM-EDS) element distribution maps of iron (Fe, in red) and zinc (Zn, in blue).** At right are shown the individual SEM-EDS element distribution maps of iron, zinc, magnesium (Mg), aluminum (Al), and silicon (Si)."
    credit: ""
    alt: "TK"
    zoom: "true"
  - id: "the-getty-peacock-fresco-fig-8a-b"
    src: "figures/the-getty-peacock-fresco-fig-8-ab.jpg"
    label: "Figs. 8A, 8B. —"
    caption: "**Detail of the Getty Peacock showing the macro X-ray fluorescence (MA-XRF) chromium (Cr) element distribution map of the region of the peacock's head (a).** In the visible image (b) green pigment can be seen extending beyond the tip of the peacock's beak, corresponding to a bright spot in the Cr map, which shows sparse, globular aggregates of a chromium-containing material throughout the peacock's head and neck."
    credit: ""
    alt: "TK"
    zoom: "true"
  - id: "the-getty-peacock-fresco-fig-9a-b"
    src: "figures/the-getty-peacock-fresco-fig-9-ab.jpg"
    label: "Figs 9A, 9B. —"
    caption: "**Backscattered electron (BSE) image of a sample of blue pigment taken from the peacock's breast (a) showing uniformly small grains with rounded edges, characteristic of synthetically produced ultramarine pigment; and [BSE image of ?] natural ultramarine pigment extracted from lapis lazuli from Afghanistan (b), showing the variety of sizes and sharp edges characteristic of a ground, natural-mineral pigment, from M. Favaro et al., “Characterization of Lapis Lazuli and Corresponding Purified Pigments for a Provenance Study of Ultramarine Pigments Used in Works of Art,” Analytical and Bioanalytical Chemistry 402, no. 6 (2012): 2202.**"
    credit: ""
    alt: "TK"
    zoom: "true"
