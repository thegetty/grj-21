    caption: "**Cross-section of a sample from the balustrade area of the Getty Peacock shown as a visible image (a); and a scanning electron microscopy (SEM) backscattered electron image (b) with overlay of distribution maps from MA-XRF scans showing iron (Fe) in red and zinc (Zn) in blue;** at right: MA-XRF distribution maps of Fe, Zn, Mg (magnesium), Al (aluminum), and Si (silicon)."
