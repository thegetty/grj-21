figure_list:
  - id: "the-getty-peacock-fresco-fig-1"
    src: "figures/the-getty-peacock-fresco-fig-1.jpg"
    label: "Fig. 1. —"
    caption: "**Wall fragment with a peacock, pigment and plaster, 40 × 24.8 × 3.2 cm.** Los Angeles, J. Paul Getty Museum, Villa collection, 68.AG.13."
    credit: ""
    alt: "A mural fragment depicts a peacock with a raised tail perching upon a latticed red fence. The bird has red wings and blue neck feathers. A red shield, partially visible, hangs above it."
    zoom: "true"
  - id: "the-getty-peacock-fresco-fig-2"
    src: "figures/the-getty-peacock-fresco-fig-2.jpg"
    label: "Fig. 2. —"
    caption: "**Robert Alexander Briggs (British, 1858–1916).** Reproduction of a watercolor of a lost ancient Roman fresco from the House of Siricus, Pompeii, from Robert Alexander Briggs, *Pompeian Decorations* (London: B. T. Batsford, 1911), unnumbered plate. Los Angeles, Getty Research Institute, 84-B30541."
    credit: ""
    alt: "Reproduction of a watercolor illustration of a decorative design that features curly vines surrounding a bordered, enclosed area with a greenish blue and red peacock standing on a fence. The peacock’s tail feathers are raised in the exact same pose as the peacock on the Getty fresco."
    zoom: "true"
  - id: "the-getty-peacock-fresco-fig-3a"
    src: "figures/the-getty-peacock-fresco-fig-3-a.jpg"
    label: "Fig. 3A. —"
    caption: "**Merchandise featuring the Getty Peacock (magnet, postcard, appointment calendar, and necklace) for sale at the Getty Museum Store, 1981–2022.**"
    credit: ""
    alt: "An array of printed and bound objects and the pendant of a necklace on a chain, all featuring a reproduction of a blue-and-red peacock in various cropped views."
    zoom: "true"
  - id: "the-getty-peacock-fresco-fig-3b"
    src: "figures/the-getty-peacock-fresco-fig-3-b.jpg"
    label: "Fig. 3B. —"
    caption: "**The Getty Museum Store at the Villa featuring window graphics of the Getty Peacock, May 2022.**"
    credit: ""
    alt: "Viewed from in an outdoor courtyard, a storefront whose full-length windows feature white-stenciled silhouettes of two facing peacocks from floor to ceiling."
    zoom: "true"
  - id: "the-getty-peacock-fresco-fig-4"
    src: "figures/the-getty-peacock-fresco-fig-4.jpg"
    label: "Fig. 4. —"
    caption: "**Ultraviolet-induced visible fluorescence (UVF) image of the Getty Peacock.**"
    credit: ""
    alt: "The peacock mural in blue and gray, showing visible fluorescence after absorbing UV light."
    zoom: "true"
  - id: "the-getty-peacock-fresco-fig-5"
    src: "figures/the-getty-peacock-fresco-fig-5.jpg"
    label: "Fig. 5. —"
    caption: "**Detail of the Roman lattice balustrade of the Getty Peacock showing pounce marks and pronounced, superficial brushwork.**"
    credit: ""
    alt: "Mural detail depicting a red lattice, in which small black dots can be seen along the outline of the crisscrossed bars."
    zoom: "true"
  - id: "the-getty-peacock-fresco-fig-6"
    src: "figures/the-getty-peacock-fresco-fig-6.jpg"
    label: "Figs. 6A–D. —"
    caption: "**MA-XRF element-distribution maps of the Getty Peacock indicating the presence of (a) iron (Fe), (b) zinc (Zn), &#40;c) copper (Cu), and (d) chromium (Cr).**"
    credit: ""
    alt: "Four mostly black images of the peacock mural, in which different areas appear in white to indicate the metallic element present."
    zoom: "true"
  - id: "the-getty-peacock-fresco-fig-7"
    src: "figures/the-getty-peacock-fresco-fig-7.jpg"
    label: "Figs. 7A, 7B. —"
    caption: "**Images of a cross-sectioned sample from the balustrade of the Getty Peacock under (a) visible light and (b) backscattered electron (BSE) imaging overlaid with  energy dispersive X-ray spectroscopy (SEM-EDS) element-distribution maps of iron (Fe, in red) and zinc (Zn, in blue); at right are shown the individual SEM-EDS element-distribution maps of iron, zinc, magnesium (Mg), aluminum (Al), and silicon (Si).**"
    credit: ""
    alt: "In the visible image, a prominent orange band appears mid-height and is interspersed with much lighter blotches. In the overlaid SEM image, a prominent gray band appears mid-height, where patches of red occur along with a sparse blue scattering, indicating the presence of iron and zinc, respectively. The MA-XRF scans show white spots against black backgrounds."
    zoom: "true"
  - id: "the-getty-peacock-fresco-fig-8a-b"
    src: "figures/the-getty-peacock-fresco-fig-8-ab.jpg"
    label: "Figs. 8A, 8B. —"
    caption: "**Detail of the Getty Peacock showing (a) MA-XRF element-distribution map of chromium (Cr) showing sparse globular aggregates of a chromium-containing material throughout the peacock’s head and neck, and (b) visible image in which green pigment can be seen extending beyond the tip of the peacock’s beak, corresponding to a bright spot in the Cr map.**"
    credit: ""
    alt: "In the MA-XRF scan, white dots of various sizes and intensities appear in the area of the peacock’s head against a black background, shown beside the visible image of the blue head of the peacock on the textured stone."
    zoom: "true"
  - id: "the-getty-peacock-fresco-fig-9a-b"
    src: "figures/the-getty-peacock-fresco-fig-9-ab.jpg"
    label: "Figs 9A, 9B. —"
    caption: "**Backscattered electron (BSE) image of (a) a sample of blue pigment taken from the peacock's breast showing uniformly small grains with rounded edges, characteristic of synthetically produced ultramarine pigment; and (b) BSE image of natural ultramarine pigment extracted from lapis lazuli from Afghanistan, showing the variety of sizes and sharp edges characteristic of a ground, natural-mineral pigment, from M. Favaro et al., “Characterization of Lapis Lazuli and Corresponding Purified Pigments for a Provenance Study of Ultramarine Pigments Used in Works of Art,” *Analytical and Bioanalytical Chemistry* 402, no. 6 (2012): 2202.**"
    credit: ""
    alt: "An image showing a cluster of similarly sized gray forms from the Getty peacock’s ultramarine against a black background in contrast with an image from lapis lazuli showing a cluster of particles in various shapes and sizes against a black background."
    zoom: "true"
  - id: "the-getty-peacock-fresco-fig-10"
    src: "figures/the-getty-peacock-fresco-fig-10.jpg"
    label: "Fig. 10. —"
    caption: "**X-radiograph of the Getty Peacock revealing the presence of chicken wire within.**"
    credit: ""
    alt: "Honeycomb wire mesh in the back of a rectangular stone object, seen in black and white."
    zoom: "true"
  - id: "the-getty-peacock-fresco-fig-11"
    src: "figures/the-getty-peacock-fresco-fig-11.jpg"
    label: "Fig. 11. —"
    caption: "**Robert Alexander Briggs (British, 1858–1916).** Exterior of a proposed “free Greek style” bungalow, from R. A. Briggs, *Bungalows and Country Residences,* 1st ed. (London: B. T. Batsford, 1891), pl. XIV. Photolithograph by James Akerman. Los Angeles, Getty Research Institute, 2625-511."
    credit: ""
    alt: "Monochrome architectural illustration of a two-story home. Its exterior facade is lined with Doric columns supporting an overhang, creating a covered veranda on the ground floor. Floorplans of both stories are included in the upper corners of the illustration."
    zoom: "true"
  - id: "the-getty-peacock-fresco-fig-12"
    src: "figures/the-getty-peacock-fresco-fig-12.jpg"
    label: "Fig. 12. —"
    caption: "**Robert Alexander Briggs (British 1858–1916).** Drawing room of a proposed “free Greek style” bungalow, from R. A. Briggs, *Bungalows and Country Residences,* 1st ed. (London: B. T. Batsford, 1891), plate XV. Photolithograph by James Akerman. Los Angeles, Getty Research Institute, 2625-511."
    credit: ""
    alt: "Monochrome architectural illustration of a drawing room decorated with various classical motifs, such as vases, hanging lamps, and Ionic columns. The frieze contains decorative murals of vines and a peacock standing on a lattice balustrade."
    zoom: "true"
  - id: "the-getty-peacock-fresco-fig-13"
    src: "figures/the-getty-peacock-fresco-fig-13.jpg"
    label: "Fig. 13. —"
    caption: "**“Doric House,” Furze Hill, Surrey, constructed in 1912, from Charles Massin, [*Villas Normandes & Anglaises*]{lang=fr} (Paris: s.n., 1913), pl. 2.**"
    credit: ""
    alt: "Black-and-white photograph of a two-story house. The exterior features Doric columns, a covered veranda, and an upper floor balcony with patio doors and windows housed in classical temple facades."
    zoom: "true"
  - id: "adding-works-to-words-fig-1"
    src: "figures/adding-works-to-words-fig-1.jpg"
    label: "Fig. 1. —"
    caption: "**Attributed to Giuseppe Panzi (Italian, active in China, 1734–1812).** [*Le Père Joseph-Marie Amiot, jésuite français missionnaire à Pékin au XVIIIe siècle*]{lang=fr} (Father Joseph-Marie Amiot, French Jesuit missionary in Beijing during the eighteenth century), before 1789, oil on Korean paper, 63 × 47 cm. Paris, Bibliothèque Nationale de France, N-4. Image © BnF, Dist. RMN-Grand Palais / Art Resource, NY."
    credit: ""
    alt: "A painted bust portrait of an older man with a long mustache and beard in three-quarter view, set against a dark gray background. He wears official Qing court attire, including a loose, medium-blue silk robe and a black round hat."
    zoom: "true"
  - id: "adding-works-to-words-fig-2"
    src: "figures/adding-works-to-words-fig-2.jpg"
    label: "Fig. 2. —"
    caption: "**Jean-Denis Attiret (French, active in France and China, 1702–68).** *Yaël and Sisera,* 1730, signed and dated on reverse: [“Attiret pingebat Dola 1730,”]{lang=la} oil on canvas, 170 × 235 cm. Dole, Musée de Beaux-Arts, inv. 389. Black-and-white image © Jean-Loup Mathieu (Eurêka), used by permission; studio Chechillot; Catherine Scheck."
    credit: ""
    alt: "A black-and-white photograph of a damaged oil painting depicts a woman in loose robes and head covering speaking with a helmeted general dressed in ancient Mediterranean uniform. They stand in front of a tent, near several other soldiers carrying bladed weapons."
    zoom: "true"
  - id: "adding-works-to-words-fig-3"
    src: "figures/adding-works-to-words-fig-3.jpg"
    label: "Fig. 3. —"
    caption: "**Jean-Denis Attiret (French, active in France and China, 1702–68).** *Portrait of Father Dominique Parrenin (1665–1741)*, [engraving from *Lettres édifiantes et curieuses, écrites des missions étrangères par quelques missionnaires de la Compagnie de Jésus,*]{lang=fr} 2nd ed., vol. 19 (Paris, 1781), opposite p. 257. Chestnut Hill, Massachusetts, Boston College Libraries."
    credit: ""
    alt: "An engraved black-and-white bust portrait of an older man with a heavy round beard and mustache wearing official Qing court attire, including a robe and a round hat, set against a curtain. Below, a short inscription in Latin gives his name and office."
    zoom: "true"
  - id: "adding-works-to-words-fig-4"
    src: "figures/adding-works-to-words-fig-4.jpg"
    label: "Fig. 4. —"
    caption: "**Jean-Denis Attiret (French, active in France and China, 1702–68).** Saint Luke pendentive, ca. 1735–37. Avignon, Chapelle Saint-Louis. Photograph by Studio Ohlala."
    credit: ""
    alt: "A painted pendentive beneath a dome, as viewed from below. The triangular space depicts a muscular older man in an act of drawing. He wears a loose pink robe and is accompanied by a short-horned reddish-brown cow."
    zoom: "true"
  - id: "adding-works-to-words-fig-5a"
    src: "figures/adding-works-to-words-fig-5a.jpg"
    label: "Fig. 5A. —"
    caption: "**Jean-Denis Attiret (French, active in France and China, 1702–68).** Draft sketch of young Chinese women for scenic illusion paintings, dateable to 1759, ink on paper, 19.7 × 9.9 cm. From [*Recueil de pièces diverses, rangées chronologiquement de 1408 à 1845,*]{lang=fr} compiled 1892, Paris, Bibliothèque Nationale de France, Département des Manuscrits, NAF 5371, fol. 56. Images: BnF."
    credit: ""
    alt: "A drawing on paper of a curtained doorway where a young woman has lifted the curtain enough to reveal her face and her full-length robe as she tilts her head to gaze at the viewer. The paper has visible stains."
    zoom: "true"
  - id: "adding-works-to-words-fig-5b"
    src: "figures/adding-works-to-words-fig-5b.jpg"
    label: "Fig. 5B. -"
    caption: "**Jean-Denis Attiret (French, active in France and China, 1702–68).** Draft sketch of young Chinese women for scenic illusion paintings, dateable to 1759, ink on paper, 19.7 × 9.9 cm. From [*Recueil de pièces diverses, rangées chronologiquement de 1408 à 1845,*]{lang=fr} compiled 1892, Paris, Bibliothèque Nationale de France, Département des Manuscrits, NAF 5371, fol. 57. Images: BnF."
    credit: ""
    alt: "A drawing on paper of a doorway with parted curtains, through which a robed young woman is seen seated at a table with a brush, poised over a piece of paper or silk as if about to write or paint. The drawing has visible stains."
    zoom: "true"
  - id: "adding-works-to-words-fig-6"
    src: "figures/adding-works-to-words-fig-6.jpg"
    label: "Fig. 6. —"
    caption: "**Jean-Denis Attiret (French, active in France and China, 1702–68) and Zhang Tingyan (Chinese, 1735–94).** *Beautiful Women,* mid-18th century, hanging scroll, ink and color on silk, 172.8 × 83.8 cm. Private collection. From *Catalogue for The Imperial Sale,* auction cat., Christie’s Hong Kong, 30 May 2005, lot 1217."
    credit: ""
    alt: "A long hanging scroll painting depicting two young women in loose, embroidered robes and dark-fur winter hats, bonding over a work of embroidery. As if viewed from a garden, a window frames the scene; the window is in turn framed by a snow-dusted blossoming plum tree."
    zoom: "true"
  - id: "adding-works-to-words-fig-7"
    src: "figures/adding-works-to-words-fig-7.jpg"
    label: "Fig. 7. —"
    caption: "**Jean-Denis Attiret (French, active in France and China, 1702–68).** *Portrait of the Qianlong Emperor,* mid-18th century, oil on Korean paper, 119 × 91.5 cm. Paris, Musée National des Arts Asiatiques–Guimet, MG 26504. Photograph by Ghislain Vanneste, © RMN-Grand Palais / Art Resource, NY."
    credit: ""
    alt: "A hanging scroll bust portrait of a middle-aged man with wispy moustache and beard wearing elaborate blue-and-gold ceremonial armor and helmet, set against a sky-blue ground."
    zoom: "true"
  - id: "adding-works-to-words-fig-8"
    src: "figures/adding-works-to-words-fig-8.jpg"
    label: "Fig. 8. —"
    caption: "**Jean-Denis Attiret (French, active in France and China, 1702–68).** *The Fine Horse Myriad Auspiciousness* (*Wan Ji Shuang* [萬吉驦]{lang=zh}), ink and color on paper, 24.2 × 29.1 cm, from the album of paintings *Ten Fine Horses* (*Shi junma tuce* [十骏马图册]{lang=zh}), dateable to 1743. Beijing, Palace Museum, [新]{lang=zh}00146057. Image provided by the Palace Museum."
    credit: ""
    alt: "One leaf from an album depicting a white horse from the rear as it turns to look to the left. The horse stands on a curving path by the water, which winds through a pair of weeping willows. The painting bears seven red imperial Qing seals and a title inked in Manchu script."
    zoom: "true"
  - id: "adding-works-to-words-fig-9"
    src: "figures/adding-works-to-words-fig-9.jpg"
    label: "Fig. 9. —"
    caption: "**Giuseppe Castiglione (Italian, active in Italy and China 1688–1766), Jean-Denis Attiret (French, active in France and China, 1702–68), and Ignatius Sichelbarth (German-Bohemian, active China 1708–80).** *Imperial Banquet in the Garden of Ten Thousand Trees* (*Wanshuyuan ciyan tu* [萬樹園賜宴圖]{lang=zh}), 1755, hanging scroll, ink and colors on silk, 221.2 × 419.6 cm. Beijing, Palace Museum, [故]{lang=zh}00006275. Image provided by the Palace Museum."
    credit: ""
    alt: "A painting of an outdoor procession. An imperial entourage enters at the left, headed toward a prominent white yurt and four banquet tables at the top right. Men dressed in Mongol and Qing court attire line up in neat rows to watch.  A mountainous landscape with a pagoda surrounds the arena."
    zoom: "true"
  - id: "adding-works-to-words-fig-10"
    src: "figures/adding-works-to-words-fig-10.jpg"
    label: "Fig. 10. —"
    caption: "**Jean-Denis Attiret (French, active in France and China, 1702–68).** *Qianlong Practicing Archery* (*Qianlong shejian tu* [乾隆射箭圖]{lang=zh}), dateable to 1754, oil on Korean paper, 95 × 213.7 cm. Beijing, Palace Museum, [故]{lang=zh}00008760. Image provided by the Palace Museum."
    credit: ""
    alt: "A painting on a horizontal paper scroll depicts an outdoor archery event. A figure in red readies an arrow at a target as the others look on. Farther off, different landscape elements span the distance of the shot."
    zoom: "true"
  - id: "adding-works-to-words-fig-11"
    src: "figures/adding-works-to-words-fig-11.jpg"
    label: "Fig. 11. —"
    caption: "**Jacques Philippe Le Bas (French, 1707–83), engraver; Jean-Denis Attiret (French, active in France and China, 1702–68), designer; and Charles-Nicolas Cochin II (French, 1715–90), printer.** [*La victoire de Khorgos*]{lang=fr} (The victory of Khorgos), etching and engraving, 100.7 × 65.4 cm (sheet), from the series [*Les conquêtes de l''empereur de la Chine*]{lang=fr} (The conquests of the emperor of China), 1774. New York, Metropolitan Museum of Art, 45.100.4, Harris Brisbane Dick Fund, 1945."
    credit: ""
    alt: "A black-and-white print depicting the Qing imperial mounted cavalry, armed with bows and arrows, galloping toward their musket-wielding enemy. The battle is set in a mountainous landscape with trees and a view into the far distant background."
    zoom: "true"
